<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#b3202a,#7a1018)}
.pouch{position:relative;width:250px;height:330px;margin-top:40px;background:#f7efe3;border-radius:28px 28px 40px 40px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.pouch:before{content:"";position:absolute;top:-58px;left:50%;width:84px;height:84px;margin-left:-42px;border:14px solid #f2c14e;border-radius:50%;box-sizing:border-box}
.band{position:absolute;top:34px;left:0;right:0;height:18px;background:#f2c14e}
.kanji{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:170px;color:#8f1520;line-height:1}
</style></head><body><div class="pouch"><div class="band"></div><div class="kanji">守</div></div></body></html>
