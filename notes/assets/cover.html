<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:-apple-system,"Helvetica Neue",sans-serif}
body{background:linear-gradient(135deg,#1c1012,#3a0f15 60%,#7a1018);color:#f7efe3;display:flex;align-items:center;padding:0 90px;box-sizing:border-box;gap:70px}
.text{flex:1}
h1{font-size:112px;margin:0;letter-spacing:-2px}
.jp{font-family:"Hiragino Mincho ProN",serif;font-size:40px;color:#f2c14e;margin:6px 0 26px}
p{font-size:34px;line-height:1.35;margin:0 0 36px;color:#f1e3d3;max-width:640px}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.chip{font-size:24px;padding:10px 20px;border:2px solid rgba(247,239,227,.45);border-radius:999px}
.pouch{position:relative;width:300px;height:400px;margin-top:50px;background:#f7efe3;border-radius:34px 34px 48px 48px;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.pouch:before{content:"";position:absolute;top:-70px;left:50%;width:100px;height:100px;margin-left:-50px;border:16px solid #f2c14e;border-radius:50%;box-sizing:border-box}
.band{position:absolute;top:40px;left:0;right:0;height:22px;background:#f2c14e}
.kanji{font-family:"Hiragino Mincho ProN",serif;font-size:210px;color:#8f1520;line-height:1}
</style></head><body>
<div class="text"><h1>Omamori</h1><div class="jp">お守り · a protective charm for AI payments</div>
<p>A payment agent for the elderly that stays safe even when a scammer fools it.</p>
<div class="chips"><span class="chip">Family rules in ENSv2</span><span class="chip">Intercepta screening</span><span class="chip">World ID approval</span><span class="chip">x402</span></div></div>
<div class="pouch"><div class="band"></div><div class="kanji">守</div></div>
</body></html>
